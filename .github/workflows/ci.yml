name: DevOps Lab CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run tests
        run: PYTHONPATH=. python -m pytest

      - name: Build container image
        run: |
          docker build \
            --tag arturasryan/devops-revision-app:${GITHUB_SHA} \
            --tag arturasryan/devops-revision-app:latest .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish commit and latest image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "arturasryan/devops-revision-app:${GITHUB_SHA}"
          docker push arturasryan/devops-revision-app:latest

  deploy:
    name: Deploy to lab server
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Pull and restart the service
        run: |
          docker compose pull app
          APP_ENV=production APP_VERSION="$(git rev-parse --short=7 HEAD)" \
            docker compose up -d --remove-orphans app

      - name: Wait for container health
        shell: bash
        run: |
          status="starting"
          for attempt in {1..30}; do
            container_id="$(docker compose ps -q app)"
            if [ -n "$container_id" ]; then
              status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"
            fi

            case "$status" in
              healthy)
                break
                ;;
              unhealthy)
                docker compose logs --tail=100 app
                exit 1
                ;;
            esac

            sleep 2
          done

          if [ "$status" != "healthy" ]; then
            docker compose logs --tail=100 app
            echo "Service did not become healthy (last status: $status)."
            exit 1
          fi

          docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
