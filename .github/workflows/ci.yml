name: DevOps Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run tests
        run: PYTHONPATH=. python -m pytest

      - name: Build container image
        run: |
          docker build \
            --tag arturasryan/devops-revision-app:${GITHUB_SHA} \
            --tag arturasryan/devops-revision-app:latest .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish commit and latest image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "arturasryan/devops-revision-app:${GITHUB_SHA}"
          docker push arturasryan/devops-revision-app:latest
